name: Build APK Qo'riqchi Pro

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Clean Android Platform
        run: |
          mkdir -p /tmp/custom_files
          cp -r android/app/src/main/kotlin /tmp/custom_files/
          cp -r android/app/src/main/res/xml /tmp/custom_files/
          cp android/app/src/main/AndroidManifest.xml /tmp/custom_files/
          rm -rf android
          flutter create --platforms=android --org uz.qoriqchi .
          mkdir -p android/app/src/main/kotlin/uz/qoriqchi/apkguard
          cp -r /tmp/custom_files/kotlin/uz/qoriqchi/apkguard/* android/app/src/main/kotlin/uz/qoriqchi/apkguard/
          mkdir -p android/app/src/main/res/xml
          cp -r /tmp/custom_files/xml/* android/app/src/main/res/xml/
          cp /tmp/custom_files/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/APK_Qoriqchi_Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK_Qoriqchi_Pro
          path: output/APK_Qoriqchi_Pro.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-qoriqchi
          name: "APK Qo'riqchi Pro v1.0.0"
          body: "🛡 APK Qo'riqchi Pro - Android qurilmalar uchun xavfsizlik va APK tahlilchi ilovasi."
          files: output/APK_Qoriqchi_Pro.apk
