name: Build APK Qo'riqchi Pro

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for clarity
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/APK_Qoriqchi_Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Qoriqchi-Pro
          path: build/app/outputs/flutter-apk/APK_Qoriqchi_Pro.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "APK Qo'riqchi Pro v1.0.0"
          body: "🛡 APK Qo'riqchi Pro - Android uchun zamonaviy APK tahlilchi va xavfsizlik himoyachisi."
          files: build/app/outputs/flutter-apk/APK_Qoriqchi_Pro.apk
