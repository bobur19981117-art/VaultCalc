services:
  - type: web
    name: userbot-album-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: ALBUM_CHANNEL_ID
        value: "-1004342721043"
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
